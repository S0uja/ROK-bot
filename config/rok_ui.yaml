# Normalized UI regions for the current Rise of Kingdoms city layout.
# Coordinates are ratios in the range 0..1, so the layout scales with resolution.
# Calibrated from the latest annotated screenshot.

regions:
  # Player profile / power / civilization / VIP area.
  profile:
    x: 0.00
    y: 0.00
    w: 0.165
    h: 0.135

  # Resource counters: extended farther left and slightly upward.
  resources:
    x: 0.600
    y: 0.00
    w: 0.400
    h: 0.070

  # Left hamburger / navigation control.
  left_navigation:
    x: 0.00
    y: 0.136
    w: 0.059
    h: 0.083

  # Quest/task cards and their scroll area.
  left_tasks:
    x: 0.00
    y: 0.236
    w: 0.118
    h: 0.357

  # Event / notification strip on the upper-right.
  # Starts farther left and sits below the resource counters.
  right_events:
    x: 0.626
    y: 0.062
    w: 0.306
    h: 0.108

  # Character / assistant panel, aligned to the right edge.
  right_character:
    x: 0.868
    y: 0.155
    w: 0.132
    h: 0.580

  # Main bottom action/navigation bar.
  # Same height as chat and flush with the bottom edge.
  bottom_navigation:
    x: 0.584
    y: 0.793
    w: 0.416
    h: 0.207

  # Chat message area, moved down and flush with the bottom edge.
  chat:
    x: 0.063
    y: 0.793
    w: 0.264
    h: 0.207

  # Main playable city surface.
  city_area:
    x: 0.118
    y: 0.173
    w: 0.750
    h: 0.613
