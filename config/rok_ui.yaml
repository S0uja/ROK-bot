# Normalized UI regions for the current Rise of Kingdoms city layout.
# Coordinates are ratios in the range 0..1, so the layout scales with resolution.

regions:
  # Player profile / power / civilization / VIP area.
  profile:
    x: 0.00
    y: 0.00
    w: 0.165
    h: 0.135

  # Resource counters: extended farther left and slightly upward.
  resources:
    x: 0.600
    y: 0.00
    w: 0.400
    h: 0.070

  # Left hamburger / navigation control.
  left_navigation:
    x: 0.00
    y: 0.136
    w: 0.059
    h: 0.083

  # Quest/task cards and their scroll area.
  left_tasks:
    x: 0.00
    y: 0.236
    w: 0.118
    h: 0.357

  # Event / notification strip: moved down so it does not overlap resources.
  right_events:
    x: 0.671
    y: 0.080
    w: 0.329
    h: 0.105

  # Character / assistant panel on the right edge.
  right_character:
    x: 0.868
    y: 0.184
    w: 0.132
    h: 0.444

  # Main bottom action/navigation bar, pushed down toward the screen edge.
  bottom_navigation:
    x: 0.584
    y: 0.835
    w: 0.416
    h: 0.165

  # Chat message area, pushed down toward the screen edge.
  chat:
    x: 0.067
    y: 0.850
    w: 0.264
    h: 0.150

  # Main playable city surface.
  city_area:
    x: 0.118
    y: 0.173
    w: 0.750
    h: 0.613
