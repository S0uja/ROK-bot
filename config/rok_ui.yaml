# Normalized UI regions for the current Rise of Kingdoms city layout.
# Coordinates are ratios in the range 0..1, so the layout scales with resolution.
# Calibrated from the latest debug screenshot.

regions:
  # Player profile / power / civilization / VIP area.
  profile:
    x: 0.00
    y: 0.00
    w: 0.165
    h: 0.135

  # Resource counters across the upper-right edge.
  resources:
    x: 0.560
    y: 0.00
    w: 0.440
    h: 0.070

  # Left hamburger / navigation control.
  left_navigation:
    x: 0.00
    y: 0.136
    w: 0.059
    h: 0.083

  # Quest/task cards and their scroll area.
  left_tasks:
    x: 0.00
    y: 0.216
    w: 0.118
    h: 0.378

  # Event / notification strip on the upper-right.
  right_events:
    x: 0.584
    y: 0.057
    w: 0.286
    h: 0.101

  # Character / assistant panel, aligned to the right edge.
  right_character:
    x: 0.811
    y: 0.160
    w: 0.189
    h: 0.527

  # Main bottom action/navigation bar.
  # Same height as chat and flush with the bottom edge.
  bottom_navigation:
    x: 0.545
    y: 0.737
    w: 0.455
    h: 0.263

  # Chat message area, flush with the bottom edge.
  chat:
    x: 0.059
    y: 0.737
    w: 0.247
    h: 0.263

  # Main playable city surface, excluding the left UI,
  # right character panel and bottom UI.
  city_area:
    x: 0.111
    y: 0.160
    w: 0.700
    h: 0.575
