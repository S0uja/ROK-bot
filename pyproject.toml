[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rok-bot"
version = "0.1.0"
description = "Rise of Kingdoms automation framework"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "opencv-python",
    "pillow",
    "numpy",
    "pytesseract",
    "rapidocr",
    "onnxruntime",
    "pyyaml",
    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["rokbot*"]
